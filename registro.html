<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de empleado</title>
</head>
<body>
    <h2>Registro de empleados</h2>
    <form action="inicio.html">
        <input id="nombre" placeholder="Escribir nombre">
        <input id="apellido" placeholder="Escribir apellido">
        <input id="cargo" size="35" placeholder="Escribir cargo (Gerente/Supervisor/Empleado)">
        <input id="area" placeholder="Escribir área">
        <input type="email" id="email" placeholder="Escribir email">
        <input type="password" id="password" placeholder="Escribir password">

        <button onclick="guardar()">Guardar</button>
    </form>

    <script src="registro.js"></script>
</body>
</html>
